
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibebench"
version = "1.5.0"
description = "An automated framework for the holistic evaluation of LLM-generated code"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Muktadir Arif" }
]
keywords = [
  "LLM",
  "code quality",
  "static analysis",
  "benchmark",
  "software engineering",
  "AI evaluation"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.9"
dependencies = [
  "radon>=6.0.1",
  "mccabe>=0.7.0",
  "pandas>=2.1.1",
  "matplotlib>=3.8.0",
  "scipy>=1.11.0",
]

[project.optional-dependencies]
llm = [
  "google-genai>=0.3.0",
  "groq>=0.4.0",
  "openai>=1.0.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.0.0",
  "flake8>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/umayer16/VIBEBENCH"
Repository = "https://github.com/umayer16/VIBEBENCH"
"Bug Tracker" = "https://github.com/umayer16/VIBEBENCH/issues"
Documentation = "https://github.com/umayer16/VIBEBENCH#readme"

[project.scripts]
vibebench = "vibebench:main"

[tool.setuptools]
py-modules = ["vibebench"]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.flake8]
max-line-length = 100
ignore = ["E203", "W503"]
exclude = [
  ".git",
  "__pycache__",
  "datasets/",
  ".venv/",
  "venv/",
]

[tool.coverage.run]
omit = [
    "core/gemini_generator.py",
    "core/groq_generator.py",
    "datasets/*",
    "tests/*",
]

[tool.coverage.report]
fail_under = 50
